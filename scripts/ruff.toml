# Host scripts: standard library only, Python 3.10+ (D58).
target-version = "py310"
line-length = 100

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
# git always runs with fixed argument lists (never a shell), resolved on PATH.
ignore = ["S603", "S607"]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
