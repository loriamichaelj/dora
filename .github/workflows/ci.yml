name: ci

# Checks changes to the pipeline itself (docs/CLOUD-DEVOPS-DESIGN.md §4.2).
# main holds only workflows, so every PR into main is linted before it can
# merge; the "Lint workflows" check is required by main's ruleset.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      # The v1.7.12 tag's commit: the download script is fetched by commit, so
      # it can't change under us.
      ACTIONLINT_COMMIT: 914e7df21a07ef503a81201c76d2b11c789d3fca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint also runs shellcheck (preinstalled on the runner) over every
      # run: script.
      - name: actionlint
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_COMMIT}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -version
          ./actionlint -color
